kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: granuwarm-local
nodes:
  - role: control-plane
    image: kindest/node:v1.31.0
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  # Reduced from 3 workers to 1 for laptop resource constraints (4GB RAM)
  - role: worker
    image: kindest/node:v1.31.0